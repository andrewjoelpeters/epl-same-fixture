<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>EPL Same Fixture</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>EPL Same Fixture</h1>
</header>
<main>
  <div id="banner-host"></div>

  <div class="card controls">
    <div class="ctrl-grid">
      <label>Season B <select id="seasonB"></select></label>
      <label>Season A <select id="seasonA"></select></label>
      <label class="team-label">Team <select id="teamSel"></select></label>
    </div>
    <div class="btn-row">
      <button id="addBtn" class="primary">+ Add result</button>
      <button id="shareBtn">Share</button>
      <button id="exportBtn" class="ghost">Export</button>
      <label class="import-label">Import<input id="importFile" type="file" accept=".json"></label>
    </div>
  </div>

  <div class="card summary-card">
    <div class="summary">
      <div><div class="k" id="kA">2026-27</div><div class="v" id="vThis">–</div><div class="k" id="kThis">0 pts</div></div>
      <div><div class="k" id="kB">2025-26</div><div class="v" id="vLast">–</div><div class="k" id="kLast">0 pts</div></div>
      <div><div class="k">Δ</div><div class="v neu" id="vDelta">–</div><div class="k" id="kDelta"></div></div>
    </div>
    <div class="k" id="summaryNote" style="text-align:center; margin-top:0.4rem"></div>
  </div>

  <div class="card table-card">
    <div class="toolbar">
      <span id="tableTitle" class="ttl"></span>
      <span id="tableMeta" class="meta"></span>
    </div>
    <div class="table-wrap">
      <table id="fixtureTable">
        <thead>
          <tr>
            <th rowspan="2" style="text-align:left">Opp</th>
            <th colspan="3" class="group sep">Home</th>
            <th colspan="3" class="group sep">Away</th>
            <th rowspan="2" class="sep">Tot</th>
          </tr>
          <tr>
            <th id="thHomeA" class="sep">A</th><th id="thHomeB">B</th><th>Δ</th>
            <th id="thAwayA" class="sep">A</th><th id="thAwayB">B</th><th>Δ</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <footer><span id="manifestHost"></span> · <a href="https://github.com/openfootball/football.json">openfootball</a></footer>
</main>

<dialog id="editDialog">
  <form method="dialog" id="editForm">
    <h3 id="dialogTitle">Add result</h3>
    <div class="form-grid">
      <label>Date<input type="date" id="fDate" required></label>
      <label>Home<select id="fHome" required></select></label>
      <label>Away<select id="fAway" required></select></label>
      <label>Hg<input type="number" id="fHg" min="0" max="20" required></label>
      <label>Ag<input type="number" id="fAg" min="0" max="20" required></label>
      <label>Round<input type="text" id="fRound" placeholder="Manual"></label>
      <input type="hidden" id="fKey">
    </div>
    <div class="form-actions">
      <button type="button" id="cancelBtn">Cancel</button>
      <button class="primary" type="submit">Save</button>
    </div>
  </form>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
