name: sync-data

on:
  schedule:
    - cron: '0 6 * * *'  # daily 06:00 UTC after openfootball bot 05:00
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/sync-data.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync openfootball data
        run: node scripts/sync.mjs
      - name: Show validation report
        run: cat public/data/validation-report.json
      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/ js/mapping.generated.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(data): sync openfootball $(date -u +%Y-%m-%d)"
            git push
          fi
